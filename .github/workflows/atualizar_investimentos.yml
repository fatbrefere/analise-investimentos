name: Atualizar dados de investimentos

on:
  schedule:
    # 23:30 UTC = 20:30 em Brasília, depois do fechamento da B3 e de Nova York (seg a sex)
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar fundamentos, macro e cotações
        run: python -m investimentos.atualizar

      - name: Salvar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investimentos/data
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza dados de investimentos ($(date -u +%Y-%m-%d))"
            git push
          fi
